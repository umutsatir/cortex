name: Release

on:
  push:
    branches:
      - stable

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: 'v${{ github.run_number }}'
          releaseName: 'Cortex v${{ github.run_number }}'
          releaseBody: |
            ## Cortex v${{ github.run_number }}

            Download the `.dmg` file below to install on macOS.
          releaseDraft: false
          prerelease: false
