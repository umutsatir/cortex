name: Release

on:
  push:
    branches:
      - stable

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          tagName: 'v__VERSION__'
          releaseName: 'Cortex v__VERSION__'
          releaseBody: |
            ## Cortex v__VERSION__

            Download the `.dmg` file below to install on macOS.

            ---

            > **macOS Gatekeeper Warning**
            > If you see *"Cortex is damaged and can't be opened"*, run the following command in Terminal after moving the app to your Applications folder:
            > ```
            > xattr -dr com.apple.quarantine /Applications/Cortex.app
            > ```
            > This happens because the app is not yet signed with an Apple Developer certificate. The app is safe to use.
          releaseDraft: false
          prerelease: false

      - name: Upload updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          SIG_FILE=$(find src-tauri/target -name "*.app.tar.gz.sig" 2>/dev/null | head -1)

          echo "Looking for .sig file..."
          find src-tauri/target -name "*.sig" 2>/dev/null || echo "No .sig files found"

          if [ -z "$SIG_FILE" ]; then
            echo "Signature file not found, skipping updater manifest"
            exit 0
          fi

          echo "Found sig: $SIG_FILE"
          SIG=$(cat "$SIG_FILE")
          UPDATE_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/Cortex_aarch64.app.tar.gz"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          python3 -c "
          import json, sys
          sig = open('${SIG_FILE}').read().strip()
          data = {
            'version': '${VERSION}',
            'notes': '',
            'pub_date': '${PUB_DATE}',
            'platforms': {
              'darwin-aarch64': {
                'signature': sig,
                'url': '${UPDATE_URL}'
              }
            }
          }
          print(json.dumps(data, indent=2))
          " > latest.json

          cat latest.json
          gh release upload "v${VERSION}" latest.json --clobber
